<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="torchGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="goldFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="#0E1015" stroke="url(#torchGrad)" stroke-width="3.5" />

  <!-- Torch Base / Emblem Wing Left -->
  <path d="M 28 68 C 28 54, 40 44, 48 30 C 44 42, 36 50, 36 62 C 36 66, 32 68, 28 68 Z" fill="url(#torchGrad)" />

  <!-- Central Dynamic Flame -->
  <path d="M 50 18 C 58 32, 68 44, 68 58 C 68 70, 58 78, 50 78 C 42 78, 32 70, 32 58 C 32 46, 42 34, 50 18 Z" fill="url(#goldFlame)" filter="url(#glow)" />

  <!-- Inner Torch Core Flame -->
  <path d="M 50 36 C 54 44, 60 52, 60 62 C 60 68, 55 72, 50 72 C 45 72, 40 68, 40 62 C 40 52, 46 44, 50 36 Z" fill="#FFFBEB" opacity="0.9" />

  <!-- Modern Crest Lettering AH Accent -->
  <path d="M 44 86 L 56 86" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
</svg>
